name: Build Khata Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android NDK 27.2.12479018 & SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "ndk;27.2.12479018"

      - name: Fetch Fonts & Run Native Setup
        run: |
          chmod +x tool/fetch_fonts.sh tool/setup_native.sh
          ./tool/fetch_fonts.sh
          ./tool/setup_native.sh

      - name: Install Dependencies & Run Codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Release APK (arm64)
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhataPro-Release-APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: error
